{% extends "base.html" %}{% block content %}<section class="login card"><h1>Welcome to TrustVault</h1><p>Sign in to manage securely shared documents.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username<input name="username" autocomplete="username" required></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form>
<div class="demo"><b>Demo accounts</b><br>Admin: <code>admin / AdminDemo123!</code><br>Owner: <code>owner / OwnerDemo123!</code><br>Viewer: <code>viewer / ViewerDemo123!</code><p>Change these passwords and the secret key before deployment.</p></div></section>{% endblock %}
