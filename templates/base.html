<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrustVault</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('dashboard') }}">🔐 TrustVault</a>
{% if g.user %}<div class="userbar"><span>{{ g.user.username }} · {{ g.user.role }}</span>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">Log out</button></form></div>{% endif %}
</header><main>{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>{% endif %}{% endwith %}
{% block content %}{% endblock %}</main><footer>TrustVault · Secure document sharing demo</footer></body></html>
